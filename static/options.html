<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ニコ生サイドバー — 連携設定</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <main class="card">
        <h1>連携設定</h1>

        <section class="section">
            <label class="row">
                <input type="checkbox" id="kick_enabled">
                <span class="row-text">
                    <span class="row-title">Kick を有効にする<span class="beta-badge">β版</span></span>
                    <span class="row-desc">
                        Kick でフォロー中の配信を、ニコ生のサイドバーに表示します。
                        kick.com 側にも同じサイドバーが出ます。
                        有効にすると kick.com へのアクセス許可を求めます。
                    </span>
                </span>
            </label>

            <div class="sub" id="kick_sub" hidden>
                <div class="test">
                    <button type="button" id="kick_test">接続テスト</button>
                    <span id="kick_test_result" class="test-result"></span>
                </div>
            </div>

            <!-- 追加の許可（doc/09 項目DE）。Kick 連携が有効で、後から足した許可が足りない時だけ出す。
                 🔴 既定は hidden。出すかどうかは options.js の syncFromPermissions が決める。 -->
            <div class="extra" id="kick_extra" hidden>
                <p class="extra-title">追加の許可について</p>
                <p class="extra-desc">
                    kick.com のサイドバーでは、終わったニコ生の番組がしばらくリストに残ることがありました。
                    番組の状態と来場者数をニコ生のページと同じ方法で取得するため、ニコニコ生放送の一部のサイトへのアクセスが必要になりました。
                </p>
                <p class="extra-desc">許可しなくても、これまでどおり使えます。</p>
                <button type="button" id="kick_extra_grant">許可する</button>
            </div>

            <p class="note" id="kick_note"></p>
        </section>

        <p class="footnote">
            この設定はいつでも取り消せます。無効にすると kick.com へのアクセス許可も削除されます。
        </p>
    </main>

    <script src="options.js"></script>
</body>

</html>
